name: React CI

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test and Build React App
    runs-on: ubuntu-latest

    container:
      image: node:20

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build
        